<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ôn Tập KTCK II Công Nghệ 11</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { 
            --primary: #2563eb; 
            --success: #059669; 
            --error: #dc2626; 
            --bg: #f1f5f9; 
            --text: #1a1a1a; /* Làm đậm màu chữ một chút để giống mực in */
            --font-main: 'STIX Two Text', serif;
            --font-heading: 'Crimson Pro', serif;
        }

        body { 
            font-family: var(--font-main); 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased; /* Giúp font chữ thanh mảnh, sắc nét hơn */
        }

        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px; 
            border-radius: 12px; /* Giảm độ bo góc một chút cho chuyên nghiệp hơn */
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0;
        }
        
        /* Header & Điểm số */
        .header-flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            font-family: var(--font-heading);
        }
        .score-live { 
            background: #10b981; 
            color: white; 
            padding: 4px 12px; 
            border-radius: 4px; 
            font-weight: 700; 
            font-size: 0.9rem; 
        }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin: 15px 0 30px; overflow: hidden; }
        #progress-fill { height: 100%; background: linear-gradient(90deg, #1e293b, #2563eb); width: 0%; transition: 0.5s; }
        
        /* Câu hỏi & Đáp án */
        .q-text { 
            font-size: 1.35rem; /* Tăng nhẹ size font serif để dễ đọc */
            font-weight: 700; 
            margin-bottom: 25px; 
            color: #000; 
            white-space: pre-wrap; 
        }
        .opt-list { display: grid; gap: 12px; }
        .opt-item { 
            padding: 16px 20px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            background: #f8fafc; 
            font-weight: 600;
            font-size: 1.1rem;
        }
        .opt-item:hover { border-color: var(--primary); background: #eff6ff; }
        
        /* Đúng/Sai */
        .tf-box { 
            border: 1px solid #e2e8f0; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 1.1rem;
        }
        .tf-btn-group { display: flex; gap: 8px; }
        .tf-btn { 
            padding: 8px 18px; 
            border: 1px solid #cbd5e1; 
            border-radius: 4px; 
            cursor: pointer; 
            background: white; 
            font-weight: 600; 
            font-family: var(--font-main);
        }
        .selected-t { background: #dcfce7; border-color: #22c55e; color: #15803d; font-weight: 700; }
        .selected-f { background: #fee2e2; border-color: #ef4444; color: #b91c1c; font-weight: 700; }
        
        /* Trạng thái */
        .correct { background: #dcfce7 !important; color: #15803d !important; border-color: #22c55e !important; }
        .wrong { background: #fee2e2 !important; color: #b91c1c !important; border-color: #ef4444 !important; }
        .hidden { display: none !important; }
        
        .main-btn { 
            width: 100%; padding: 16px; border: none; border-radius: 8px; background: #1e293b; 
            color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 25px; 
            font-family: var(--font-main);
        }
        .menu-btn { background: var(--primary); margin-bottom: 15px; margin-top: 0; }
        
        /* Review Card */
        .review-card { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .review-header { background: #f8fafc; padding: 10px 15px; font-weight: 700; font-size: 0.85rem; border-bottom: 1px solid #e2e8f0; text-transform: uppercase; }
        .review-body { padding: 15px; font-size: 1.05rem; }
        .ans-box { padding: 10px; border-radius: 6px; margin-top: 5px; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container" id="start-screen" style="text-align: center;">
    <h1 style="color: var(--primary); margin-bottom: 30px;">Ôn Tập Công Nghệ 11</h1>
    <p style="margin-bottom: 30px; color: #64748b;">Vui lòng chọn nội dung bạn muốn ôn tập:</p>
    <button class="main-btn menu-btn" onclick="startQuiz('mc')">Trắc Nghiệm</button>
    <button class="main-btn menu-btn" onclick="startQuiz('tf')">Đúng / Sai</button>
    <button class="main-btn menu-btn" onclick="startQuiz('all')" style="background: #10b981;">Trắc Nghiệm + Đúng / Sai</button>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="header-flex">
        <div>
            <h2 id="part-name" style="color: var(--primary); margin: 0; font-size: 1rem; text-transform: uppercase;">PHẦN THI</h2>
            <span id="score-live-display" class="score-live">Đúng: 0</span>
        </div>
        <span id="info" style="font-weight: 700; color: #64748b;">0 / 0</span>
    </div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    
    <div id="quiz-body"></div>
    <button id="action-btn" class="main-btn hidden">Tiếp theo</button>
</div>

<script>
    // Dữ liệu đã được chỉnh sửa theo yêu cầu: 
    // - Giữ nguyên nội dung đầy đủ của các đáp án gộp.
    // - Chọn đáp án đúng theo phần tô vàng trong tài liệu.
    const rawMC = [
        {q: "Hệ thống cơ khí động lực gồm những bộ phận nào?", options: ["Nguồn động lực, hệ thống truyền lực.", "Nguồn động lực, hệ thống truyền lực, máy công tác.", "Nguồn động lực, máy công tác.", "Máy công tác, hệ thống truyền lực."], a: "Nguồn động lực, hệ thống truyền lực, máy công tác."},
        {q: "Nguồn động lực trong hệ thống cơ khí động lực có vai trò gì?", options: ["Cung cấp năng lượng cho hệ thống hoạt động.", "Truyền và biến đổi năng lượng từ nguồn động lực đến máy công tác.", "Đảm bảo cho hệ thống làm việc ở các môi trường, điều kiện khác nhau.", "Cung cấp năng lượng cho hệ thống hoạt động; Truyền và biến đổi năng lượng từ nguồn động lực đến máy công tác."], a: "Cung cấp năng lượng cho hệ thống hoạt động."},
        {q: "Hệ thống truyền lực trong hệ thống cơ khí động lực có vai trò gì?", options: ["Cung cấp năng lượng cho hệ thống hoạt động.", "Truyền và biến đổi năng lượng từ nguồn động lực đến máy công tác.", "Đảm bảo cho hệ thống làm việc ở các môi trường, điều kiện khác nhau.", "Cả 3 đáp án còn lại."], a: "Truyền và biến đổi năng lượng từ nguồn động lực đến máy công tác."},
        {q: "Máy công tác trong hệ thống cơ khí động lực có vai trò gì?", options: ["Cung cấp năng lượng cho hệ thống hoạt động.", "Truyền và biến đổi năng lượng từ nguồn động lực đến máy công tác.", "  Đảm bảo cho hệ thống làm việc ở các môi trường, điều kiện khác nhau.", "Truyền và biến đổi năng lượng từ nguồn động lực đến máy công tác; Đảm bảo cho hệ thống làm việc ở các môi trường, điều kiện khác nhau."], a: "  Đảm bảo cho hệ thống làm việc ở các môi trường, điều kiện khác nhau."},
        {q: "Phương tiện giao thông vận tải chủ yếu trên đường bộ là", options: ["Xe máy", "Ô tô", "Xe quân sự", "Xe chữa cháy."], a: "Ô tô"},
        {q: "Đặc điểm nào sau đây không có ở tàu thủy?", options: ["Có sức chuyên chở rất lớn.", "Thường sử dụng trong vận tải hàng hóa quốc tế.", "Tốc độ chuyển động rất nhanh.", "Cần đến hạ tầng cụm cảng lớn."], a: "Tốc độ chuyển động rất nhanh."},
        {q: "Đâu là ngành nghề trong lĩnh vực cơ khí động lực?", options: ["Nghiên cứu thiết kế, phát triển sản phẩm cơ khí động lực.", "Sản xuất, lắp ráp sản phẩm cơ khí động lực.", "Bảo dưỡng, sửa chữa máy cơ khí động lực.", "Cả 3 đáp án còn lại."], a: "Cả 3 đáp án còn lại."},
        {q: "Nghiên cứu thiết kế, phát triển sản phẩm cơ khí động lực là nhóm công việc nghiên cứu ứng dụng các kiến thức thuộc lĩnh vực nào?", options: ["Toán", "Khoa học", "Kĩ Thuật.", "Cả 3 đáp án còn lại."], a: "Cả 3 đáp án còn lại."},

        {q: "Sản xuất, lắp ráp sản phẩm cơ khí động lực thực hiện công việc gì?", options: ["Chế tạo và lắp ráp các chi tiết hoặc cụm chi tiết thành các sản phẩm hoàn chỉnh, kiểm tra đánh giá chất lượng sản phẩm trước khi xuất xưởng.", "Bảo dưỡng, sửa chữa máy, thiết bị cơ khí động lực.", "Xây dựng các bản vẽ, tính toán, mô phỏng các sản phẩm máy móc, … thuộc lĩnh vực cơ khí động lực.", "Cả 3 đáp án còn lại."], a: "Chế tạo và lắp ráp các chi tiết hoặc cụm chi tiết thành các sản phẩm hoàn chỉnh, kiểm tra đánh giá chất lượng sản phẩm trước khi xuất xưởng."},
        {q: "Người làm nghề nào phải có kiến thức, kinh nghiệm, kĩ năng vận hành cũng như khả năng phán đoán để phát hiện các lỗi, hỏng hóc của máy, thiết bị và đưa ra được các phương án khắc phục?", options: ["Sản xuất máy thiết bị cơ khí động lực.", "Thiết kế kĩ thuật cơ khí động lực.", "Lắp ráp máy, thiết bị cơ khí động lực.", "Bảo dưỡng, sửa chữa máy, thiết bị cơ khí động lực."], a: "Bảo dưỡng, sửa chữa máy, thiết bị cơ khí động lực."},
        {q: "Quá trình chuyển hóa năng lượng trong động cơ đốt trong là?", options: ["Nhiệt năng → Điện năng → Cơ năng", "Nhiệt năng → Hóa năng → Cơ năng", "Hóa năng → Nhiệt năng → Cơ năng", "Hóa năng → Cơ năng → Nhiệt năng"], a: "Hóa năng → Nhiệt năng → Cơ năng"},
        {q: "Khái niệm điểm chết dưới?", options: ["Là điểm chết mà tại đó pit-tông ở gần tâm trục khuỷu nhất.", "Là điểm chết mà tại đó pit-tông ở xa tâm trục khuỷu nhất.", "Là vị trí mà tại đó pit-tông đổi chiều chuyển động", "Không xác định được"], a: "Là điểm chết mà tại đó pit-tông ở gần tâm trục khuỷu nhất."},
        {q: "Mối quan hệ giữa hành trình pit-tông và bán kính quay trục khuỷu là", options: ["S = R.", "S = 2R.", "R = 2S.", "S = 3R"], a: "S = 2R."},
        {q: "Tính thể tích công tác của một xi lanh khi biết thể tích công tác của động cơ 4 xi lanh là 2,4 lít?", options: ["0,6 lít.", "6 lít.", "9,6 lít.", "6,4 lít"], a: "0,6 lít."},
        {q: "Phân loại theo hành trình của pit-tông trong một chu trình làm việc, động cơ đốt trong được phân thành mấy loại?", options: ["Hai loại.", "Ba loại.", "Bốn loại.", "Nhiều loại."], a: "Hai loại."},
        {q: "Động cơ xăng có tỉ số nén:", options: ["6 → 10.", "2 → 6.", "10 → 15.", "15 → 21."], a: "6 → 10."},
        {q: "Khi động cơ hoạt động, pit-tông dịch chuyển một hành trình thì trục khuỷu quay mấy vòng?", options: ["Một vòng.", "Hai vòng.", "Nửa vòng.", "Bốn vòng."], a: "Nửa vòng."},
        {q: "Trong một chu trình làm việc của động cơ 4 kì, trục cam quay mấy vòng?", options: ["Một vòng.", "Hai vòng.", "Nửa vòng.", "Bốn vòng."], a: "Một vòng."},
        {q: "Trong kì nạp của động cơ xăng 4 kì:", options: ["Xupap nạp mở.", "Hòa khí được nạp vào xilanh.", "Xupap nạp mở; Hòa khí được nạp vào xilanh.", "Vòi phun, phun tơi nhiên liệu vào xi lanh."], a: "Xupap nạp mở; Hòa khí được nạp vào xilanh."},
        {q: "Trong kì nén của động cơ xăng 4 kì:", options: ["Xupap nạp mở.", "Không khí trong xilanh bị nén.", "Xupap thải mở.", "Cả hai xupap đều đóng."], a: "Cả hai xupap đều đóng."},
        {q: "Trong kì nạp của động cơ điêzen 4 kì:", options: ["Không khí được nạp vào xilanh.", "Hòa khí được nạp vào xilanh.", "Dầu điezen được nạp vào xi lanh.", "Vòi phun, phun tơi nhiên liệu vào xi lanh."], a: "Không khí được nạp vào xilanh."},
        {q: "Trên thành xilanh của động cơ xăng 2 kì có mấy cửa khí?", options: ["Một.", "Hai.", "Ba.", "Bốn."], a: "Ba."},
        {q: "Trong kì cháy – dãn nở của động cơ điêzen 4 kì:", options: ["Pit-tông từ ĐCD lên ĐCT.", "Xupap thải mở.", "Pit-tông được trục khuỷu dẫn động từ ĐCT xuống ĐCD.", "Pit-tông dẫn động trục khuỷu quay thông qua thanh truyền."], a: "Pit-tông dẫn động trục khuỷu quay thông qua thanh truyền."},
        {q: "Trong một chu trình làm việc của động cơ xăng 2 kì, trục khuỷu quay một góc bao nhiêu độ?", options: ["90°.", "180°.", "360°.", "720°."], a: "360°."},
        {q: "Trong kì 2 của động cơ xăng 2 kì, trong xilanh lần lượt diễn ra các quá trình:", options: ["Cháy giãn nở, lọt khí, quét khí và nạp hòa khí mới vào xi lanh.", "Thải tự do, lọt khí, quét khí và nạp hòa khí mới vào xi lanh.", "Quét khí và nạp hòa khí mới vào xi lanh, lọt khí, nén và cháy.", "Quét khí và nạp hòa khí mới vào xi lanh, lọt khí, nén và cháy, nạp hòa khí mới vào các te."], a: "Quét khí và nạp hòa khí mới vào xi lanh, lọt khí, nén và cháy, nạp hòa khí mới vào các te."},
        {q: "Trong kì 1 của động cơ xăng 2 kì, trong xilanh lần lượt diễn ra các quá trình:", options: ["Cháy giãn nở, lọt khí, quét khí và nạp hòa khí mới vào xi lanh.", "Thải tự do, lọt khí, quét khí và nạp hòa khí mới vào xi lanh.", "Cháy giãn nở, thải tự do, nạp hòa khí mới vào các te.", "Cháy giãn nở, thải tự do, quét khí và nạp hòa khí mới vào xi lanh."], a: "Cháy giãn nở, thải tự do, quét khí và nạp hòa khí mới vào xi lanh."},
        {q: "Trong động cơ xăng 2 kì, quá trình nạp hòa khí vào cacte được thực hiện ở kì nào?", options: ["Kì 1.", "Kì 2.", "Kì 3.", "Kì 4."], a: "Kì 2."},
        {q: "Quá trình cháy dãn nở trong động cơ xăng 2 kì kết thúc khi nào?", options: ["Pit-tông bắt đầu đóng kín cửa thải.", "Pít-tông bắt đầu đóng kín cửa quét.", "Pít-tông bắt đầu mở cửa thải.", "Pít-tông bắt đầu mở cửa nạp."], a: "Pít-tông bắt đầu mở cửa thải."},
        {q: "Trong một chu trình làm việc của động cơ đốt trong 4 kì, mỗi xupap nạp và xupap thải mở mấy lần?", options: ["1 lần.", "2 lần.", "4 lần.", "Mở liên tục."], a: "1 lần."},
        {q: "Trong động cơ 2 kì chi tiết nào làm nhiệm vụ đóng mở các cửa nạp và cửa thải?", options: ["Xilanh.", "Nắp máy.", "Xupap.", "Pit-tông."], a: "Pit-tông."},
        {q: "Phân loại theo nhiên liệu sử dụng, động cơ đốt trong được phân thành mấy loại?", options: ["Hai loại.", "Ba loại.", "Bốn loại.", "Nhiều loại."], a: "Ba loại."},
        {q: "Thể tích không gian giới hạn bởi nắp máy, xilanh và đỉnh pit-tông khi pit-tông ở điểm chết trên là:", options: ["Thể tích xilanh.", "Thể tích toàn phần.", "Thể tích buồng cháy.", "Thể tích công tác."], a: "Thể tích buồng cháy."},
        {q: "Thể tích không gian giới hạn bởi nắp máy, xilanh và đỉnh pit-tông khi pit-tông ở điểm chết dưới là:", options: ["Thể tích xilanh.", "Thể tích toàn phần.", "Thể tích buồng cháy.", "Thể tích công tác."], a: "Thể tích toàn phần."},
        {q: "Thể tích không gian giới hạn bởi nắp máy, xilanh và đỉnh pit-tông là:", options: ["Thể tích xilanh.", "Thể tích toàn phần.", "Thể tích buồng cháy.", "Thể tích công tác."], a: "Thể tích xilanh."},
        {q: "Xe máy Honda Wave 110cc đó là thể tích nào?", options: ["Thể tích xi lanh.", "Thể tích toàn phần.", "Thể tích buồng cháy.", "Thể tích công tác."], a: "Thể tích công tác."},

    {t: "b) Khi xe chuyển động qua mặt đường không bằng phẳng, nhờ có bộ phận giảm chấn liên kết giữa bánh xe và thân xe giúp giảm thiểu được lực va đập (xóc) truyền lên thân xe.", a: false},
    {t: "c) Bộ phận đàn hồi là bóng khí nén được sử dụng ngày càng phổ biến trên ô tô khách, vì hệ số độ cứng của bộ phận đàn hồi có thể thay đổi được bằng cách tự động điều chỉnh áp suất khí nén trong bộ phận đàn hồi.", a: true},
    {t: "d) Để các lốp mòn đồng đều, lốp thường được đảo vị trí cho nhau sau mỗi hành trình khoảng 10.000 Km.", a: true}
]},

{title: "Câu 13. Nhóm học sinh thảo luận về hệ thống lái", items: [
    {t: "a) Dẫn động lái là bộ phận tạo ra tỉ số truyền chính của hệ thống lái. Dẫn động lái gồm dẫn động lái trước cơ cấu lái và dẫn động lái sau cơ cấu lái.", a: false},
    {t: "b) Hệ thống trợ lực lái có tác dụng giảm nhẹ lực cần tác dụng lên vành lái để điều khiển hướng chuyển động của xe.", a: true},
    {t: "c) Cần quay vành lái theo chiều sang phải để xe tiến sang phải, lùi xe sang trái cần quay vành lái theo hướng sang phải.", a: false},
    {t: "d) Công việc kiểm tra, bảo dưỡng hệ thống lái theo định kì không cần kiểm tra mức dầu trợ lực lái, vì khi hệ thống hoạt động mức dầu trợ lực không bị hao phí.", a: false}
]},
        
    ];

    // --- BIẾN HỆ THỐNG (GIỮ NGUYÊN TỪ WEB CŨ) ---
    let currentIdx = 0;
    let score = 0;
    let shuffledQuiz = [];
    let tfState = [];
    let wrongAnswers = [];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // --- TÍNH NĂNG MỚI: CHỌN CHẾ ĐỘ ---
    function startQuiz(mode) {
        currentIdx = 0;
        score = 0;
        wrongAnswers = [];
        
        let mcPart = [];
        let tfPart = [];

        if (mode === 'mc' || mode === 'all') {
            mcPart = shuffle([...rawMC]).map(q => ({...q, type: 'MC', options: shuffle([...q.options])}));
        }
        if (mode === 'tf' || mode === 'all') {
            tfPart = shuffle([...rawTF]).map(q => ({...q, type: 'TF'}));
        }

        shuffledQuiz = [...mcPart, ...tfPart];

        if (shuffledQuiz.length === 0) {
            alert("Không có câu hỏi cho chế độ này!");
            return;
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        render();
    }

    function render() {
        const body = document.getElementById('quiz-body');
        const btn = document.getElementById('action-btn');
        const q = shuffledQuiz[currentIdx];
        
        // Cập nhật điểm và thông tin
        document.getElementById('score-live-display').innerText = `Đúng: ${score}`;
        document.getElementById('info').innerText = `${currentIdx + 1} / ${shuffledQuiz.length}`;
        document.getElementById('progress-fill').style.width = `${((currentIdx) / shuffledQuiz.length) * 100}%`;
        document.getElementById('part-name').innerText = q.type === 'MC' ? "PHẦN I: TRẮC NGHIỆM" : "PHẦN II: ĐÚNG / SAI";
        
        body.innerHTML = '';
        btn.classList.add('hidden');

        if (q.type === 'MC') {
            body.innerHTML = `<div class="q-text">${q.q}</div><div class="opt-list" id="opt-list"></div>`;
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'opt-item';
                div.innerHTML = `<strong>${String.fromCharCode(65+i)}.</strong> ${opt}`;
                div.onclick = () => handleMC(div, opt, q.a);
                document.getElementById('opt-list').appendChild(div);
            });
        } else {
            tfState = new Array(4).fill(null);
            let img = q.image ? `<img src="${q.image}" class="q-image" style="max-width:100%; margin-bottom:15px;">` : "";
            body.innerHTML = `${img}<div class="q-text">${q.title}</div><div id="tf-wrap"></div>`;
            q.items.forEach((item, i) => {
                const box = document.createElement('div');
                box.className = 'tf-box';
                box.innerHTML = `<div style="flex:1; padding-right:10px;">${item.t}</div>
                <div class="tf-btn-group">
                    <button class="tf-btn" onclick="handleTF(${i}, true, this)">ĐÚNG</button>
                    <button class="tf-btn" onclick="handleTF(${i}, false, this)">SAI</button>
                </div>`;
                document.getElementById('tf-wrap').appendChild(box);
            });
            btn.innerText = "Xác nhận";
            btn.classList.remove('hidden');
            btn.disabled = true;
            btn.onclick = processTF;
        }
    }

    function handleMC(el, sel, cor) {
        document.querySelectorAll('.opt-item').forEach(i => i.style.pointerEvents = 'none');
        if (sel === cor) {
            el.classList.add('correct');
            score++;
            document.getElementById('score-live-display').innerText = `Đúng: ${score}`;
        } else {
            el.classList.add('wrong');
            document.querySelectorAll('.opt-item').forEach(i => {
                if(i.innerText.includes(cor)) i.classList.add('correct');
            });
            wrongAnswers.push({ q: shuffledQuiz[currentIdx].q, mine: sel, correct: cor, type: 'MC' });
        }
        const btn = document.getElementById('action-btn');
        btn.innerText = "Tiếp theo";
        btn.classList.remove('hidden');
        btn.disabled = false;
        btn.onclick = next;
    }

    function handleTF(idx, val, btn) {
        tfState[idx] = val;
        btn.parentElement.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected-t', 'selected-f'));
        btn.classList.add(val ? 'selected-t' : 'selected-f');
        document.getElementById('action-btn').disabled = tfState.includes(null);
    }

    function processTF() {
        const q = shuffledQuiz[currentIdx];
        const boxes = document.querySelectorAll('.tf-box');
        let faults = [];
        let allOk = true;

        q.items.forEach((item, i) => {
            const btns = boxes[i].querySelectorAll('.tf-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');
            if (item.a) btns[0].classList.add('correct'); else btns[1].classList.add('correct');
            if (tfState[i] !== item.a) {
                allOk = false;
                if(tfState[i]) btns[0].classList.add('wrong'); else btns[1].classList.add('wrong');
                faults.push({ t: item.t, mine: tfState[i], cor: item.a });
            }
        });

        if (allOk) {
            score += 2;
            document.getElementById('score-live-display').innerText = `Đúng: ${score}`;
        } else {
            wrongAnswers.push({ q: q.title, faults, type: 'TF' });
        }

        const btn = document.getElementById('action-btn');
        btn.innerText = "Tiếp theo";
        btn.onclick = next;
    }

    function next() {
        currentIdx++;
        if (currentIdx < shuffledQuiz.length) render();
        else showFinal();
    }

    function showFinal() {
        // Tính điểm tối đa dựa trên số câu thực tế đã nạp
        let maxMC = shuffledQuiz.filter(q => q.type === 'MC').length;
        let maxTF = shuffledQuiz.filter(q => q.type === 'TF').length * 2;
        const max = maxMC + maxTF;

        let listHtml = wrongAnswers.length > 0 ? `<h3 style="color:var(--error); margin-top:40px;">Danh sách câu làm sai:</h3>` : `<h3 style="color:var(--success)">Tuyệt vời! Bạn không sai câu nào.</h3>`;
        
        wrongAnswers.forEach((item) => {
            listHtml += `
            <div class="review-card">
                <div class="review-header"><span>${item.type === 'MC' ? 'TRẮC NGHIỆM' : 'ĐÚNG / SAI'}</span></div>
                <div class="review-body">
                    <div style="font-weight:700; margin-bottom:10px;">${item.q}</div>
                    ${item.type === 'MC' ? `
                        <div class="ans-box" style="background:#fee2e2; color:#991b1b;">✖ Bạn chọn: ${item.mine}</div>
                        <div class="ans-box" style="background:#dcfce7; color:#065f46;">✔ Đáp án đúng: ${item.correct}</div>
                    ` : `
                        ${item.faults.map(f => `
                            <div style="border-top: 1px solid #eee; padding-top:10px; margin-top:10px;">
                                <div style="font-size:0.9rem;">${f.t}</div>
                                <div style="font-size:0.85rem; margin-top:5px;">
                                    <span style="color:var(--error)">✖ Chọn: ${f.mine?'Đúng':'Sai'}</span> | 
                                    <span style="color:var(--success)">✔ Đáp án: ${f.cor?'Đúng':'Sai'}</span>
                                </div>
                            </div>
                        `).join('')}
                    `}
                </div>
            </div>`;
        });

        document.getElementById('quiz-screen').innerHTML = `
            <div style="text-align:center;">
                <h2 style="color:var(--primary); margin:0;">KẾT QUẢ CUỐI CÙNG</h2>
                <div style="font-size:4rem; font-weight:900; margin:20px 0;">${score} <small style="font-size:1.5rem; color:#64748b;">/ ${max}</small></div>
                <div style="text-align:left;">${listHtml}</div>
                <button class="main-btn" onclick="location.reload()">Làm lại bài mới</button>
            </div>
        `;
    }
</script>
</body>
</html>
